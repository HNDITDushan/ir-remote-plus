plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.irremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.universal.irremote'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be installed directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
